<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Sea Chest Tracker</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#eef2ff;margin:0;padding:18px;max-width:850px;margin:auto}h1{font-size:1.6rem}p{color:#b9c5d9}.bar{height:14px;background:#344155;border-radius:12px;overflow:hidden}.fill{height:100%;background:#56c99a;width:0}button,select{padding:10px;border:0;border-radius:8px;background:#334766;color:white}button{cursor:pointer}section{background:#1b293c;border-radius:12px;margin:14px 0;padding:12px}h2{font-size:1.2rem;margin:4px 0 12px}h3{font-size:1rem;margin:12px 0 6px}.silver{color:#d0d7e2}.gold{color:#ffd46a}.diamond{color:#83e7ff}label{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid #344155;line-height:1.35}input{width:20px;height:20px;flex-shrink:0;accent-color:#56c99a}label:has(input:checked) span{text-decoration:line-through;opacity:.5}.top{position:sticky;top:0;background:#101827;padding:10px 0;z-index:1}</style></head><body><h1>Second Sea Chest Tracker</h1><p>Silver, Gold & Diamond chests. Check off each chest as you collect it. Progress saves on this device.</p><div class="top"><strong id="progress"></strong><div class="bar"><div class="fill" id="fill"></div></div><p><button id="reset">Reset all checks</button> <select id="filter"><option value="all">All islands</option></select></p></div><main id="main"></main><script>
const data={
'Kingdom of Rose':{
Silver:['Above the top raids table','Left of the orange building near the Café','Between the blue and pink building in the Swan Pirates area','Behind the orange building in the Swan Pirates area','Between the stairs near the docks and a purple house','Between a green and blue house in the Swan Pirates area'],
Gold:['Above the top raids table in the Café','Beside the Awakening Specialist under the Café','Behind a thin wall near the blue building by the Pirate Recruiter (1/3)','Behind a thin wall near the blue building by the Pirate Recruiter (2/3)','Behind a thin wall near the blue building by the Pirate Recruiter (3/3)','On top of the orange building in the Swan Pirates area','Near the entrance to the underground tunnel','At the 7th pentagon from the left inside the Colosseum’s third layer','Hidden room in the stairs near Don Swan’s mansion (destructible wall)','Next to the blue house with a golden chest on top','On top of the building where Don Swan is'],
Diamond:['At the 7th pentagon in the Colosseum’s third layer','Behind the chair at the Mansion','On top of Diamond’s tree']},
'Green Zone':{Silver:['Inside a crater near Orbitus','Behind a brown rock near the Marine Captains','Behind a brown rock near the bridge (1/2)','Behind a brown rock near the bridge (2/2)'],Gold:['Half buried behind Orbitus','On a leaf near the Marine Captains'],Diamond:['At the base of the beanstalk near Orbitus']},
'Graveyard':{Silver:['On the tallest mountain, above the Crew Captain'],Gold:['On three stone pillars','Above and inside the southern island of the graveyard'],Diamond:['At Cave Island, inside the green roofed house south of the graveyard, hidden in the ceiling area']},
'Snow Mountain':{Silver:['Behind one of the houses near the Snow Troopers','Behind some ice near the Snow Troopers'],Gold:['Northwest part of the south half of the island, second ledge up','Southeast part of the north island, second ledge up']},
'Dark Arena':{Silver:['Around the edge of the arena (1/3)','Around the edge of the arena (2/3)','Around the edge of the arena (3/3)'],Gold:['Behind a rock']},
'Hot and Cold':{Silver:['Inside the raid room','Inside the igloos across the island'],Gold:['On the roof of Smoke Admiral’s building','Inside the raid room (1/2)','Inside the raid room (2/2)','Behind the right gear on the mountain near the Law Raid room'],Diamond:['On top of the tallest antenna of the Lab (Cold side)']},
'Cursed Ship':{Silver:['In the main room of the left wing','Beside El Rodolfo'],Gold:['Left wing, Ship Deckhand room (1/6)','Left wing, Ship Deckhand room (2/6)','Left wing, Ship Deckhand room (3/6)','Left wing, Ship Deckhand room (4/6)','Left wing, Ship Deckhand room (5/6)','Left wing, Ship Deckhand room (6/6)','Behind the bed near El Perro'],Diamond:['Inside the 7th locker in the kitchen past the stairwell']},
'Ice Castle':{Silver:['Inside the left room of the castle','On a ledge near the castle','Behind a rock near the spawn point'],Gold:['Inside the left room of the castle (1/2)','Inside the left room of the castle (2/2)','Under a tree on a hill near the Arctic Warriors','On a rock ledge west of the castle bridge','On a ledge southwest of the island'],Diamond:['On the roof of the keep, northeast corner']},
'Forgotten Island':{Silver:['On the rock west of Tide Keeper','Below the skull near the dock'],Gold:['Behind Tide Keeper','In front of the houses with Water Fighters (1/5)','In front of the houses with Water Fighters (2/5)','In front of the houses with Water Fighters (3/5)','In front of the houses with Water Fighters (4/5)','In front of the houses with Water Fighters (5/5)'],Diamond:['Above a rock east of Tide Keeper (shortest rock in a cluster of four)']},
'Usoapp’s Island':{Silver:['Inside one of the houses'],Gold:['Behind the house where the Lord of Destruction is']}
};
const entries=[];for(const [island,types] of Object.entries(data))for(const [type,locs] of Object.entries(types))locs.forEach((location,index)=>entries.push({island,type,location,id:island+'|'+type+'|'+index}));const key='blox-second-sea-checks-v1';let checked={};try{checked=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const save=()=>localStorage.setItem(key,JSON.stringify(checked));const main=document.getElementById('main'),filter=document.getElementById('filter');Object.keys(data).forEach(island=>{const option=document.createElement('option');option.value=island;option.textContent=island;filter.append(option)});function render(){main.innerHTML='';for(const [island,types] of Object.entries(data)){if(filter.value!=='all'&&filter.value!==island)continue;const section=document.createElement('section');const h=document.createElement('h2');h.textContent=island;section.append(h);for(const [type,locs] of Object.entries(types)){const title=document.createElement('h3');title.className=type.toLowerCase();title.textContent=type+' ('+locs.length+')';section.append(title);locs.forEach((location,index)=>{const id=island+'|'+type+'|'+index;const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.checked=!!checked[id];box.addEventListener('change',()=>{checked[id]=box.checked;save();update();label.querySelector('span').style.textDecoration=box.checked?'line-through':'none';label.querySelector('span').style.opacity=box.checked?'.5':'1'});const span=document.createElement('span');span.textContent=location;label.append(box,span);section.append(label)})}main.append(section)}update()}function update(){const count=entries.filter(e=>checked[e.id]).length;document.getElementById('progress').textContent=count+' / '+entries.length+' chests checked';document.getElementById('fill').style.width=(100*count/entries.length)+'%'}filter.addEventListener('change',render);document.getElementById('reset').addEventListener('click',()=>{if(confirm('Clear all checked chests?')){checked={};save();render()}});render();
</script></body></html>
